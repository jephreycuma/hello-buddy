<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Buddy - 2FA Verification</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images.png}" href="images.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="bg-gray-900 text-white p-6 border-b-2 border-red-600 text-center">
            <h2 class="text-xl font-extrabold tracking-wide">🔑 Two-Factor Verification</h2>
            <p class="text-xs text-gray-400 mt-1">Enter the 6-digit OTP code sent to your account</p>
        </div>
        <form th:action="@{/wallet/verify-2fa}" method="POST" class="p-6 space-y-4">
            <div th:if="${error}" class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-semibold" th:text="${error}"></div>
            
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">6-Digit Verification Code</label>
                <input type="text" name="otpCode" maxlength="6" required placeholder="123456" class="w-full p-3 border border-gray-200 rounded-xl text-center font-mono text-2xl font-bold tracking-widest focus:outline-none focus:border-red-600">
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 pt-2">
               <a th:href="@{/}" class="w-1/2 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl text-sm transition border border-gray-200">
                        Cancel
                    </a>
                <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md">
                    Verify & Login
                </button>
            </div>
        </form>
    </div>
</body>
</html>
